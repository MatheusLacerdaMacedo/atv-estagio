<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIPAD - Sistema Padronizado</title>
    
    <!-- Fonte Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome 6 (Ícones corporativos) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <!-- Seu arquivo de estilo -->
    <link rel="stylesheet" href="sipad-estilo.css">
</head>
<body>

<!-- Barra superior (visível apenas em telas pequenas) -->
<div class="mobile-topbar">
    <button type="button" class="menu-toggle" onclick="toggleMenu()" aria-label="Abrir menu" aria-controls="sidebar">
        <i class="fa-solid fa-bars"></i>
    </button>
    <div class="d-flex align-items-center gap-2">
        <i class="fa-solid fa-file-shield text-primary"></i>
        <strong>SIPAD</strong>
    </div>
</div>

<!-- Fundo escurecido que fecha o menu ao tocar -->
<div class="sb-backdrop" onclick="closeMenu()"></div>

<header id="sidebar">
    <!-- Área da Marca / Logótipo -->
    <div class="d-flex align-items-center gap-3 mb-4 px-2">
        <div class="bg-primary text-white rounded d-flex align-items-center justify-content-center shadow-sm" style="width: 42px; height: 42px; flex-shrink: 0;">
            <i class="fa-solid fa-file-shield fs-5"></i>
        </div>
        <div class="overflow-hidden flex-grow-1">
            <h5 class="mb-0 fw-bold text-white text-truncate">SIPAD</h5>
            <small class="text-secondary text-truncate d-block" style="font-size: 0.65rem; letter-spacing: 0.5px;">PADRONIZAÇÃO DOCUMENTAL</small>
        </div>
        <!-- Botão fechar (só aparece no celular) -->
        <button type="button" class="btn btn-sm btn-outline-secondary border-0 d-lg-none" onclick="closeMenu()" aria-label="Fechar menu">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>
    
    <!-- Links de Navegação -->
    <nav id="navbar" class="d-flex flex-column gap-1 flex-grow-1"></nav>
    
    <!-- Área do Utilizador -->
    <div id="user-info" class="mt-auto pt-3 w-100"></div>
</header>

    <main id="app">
        <!-- Renderização via JS -->
    </main>
    <div id="toast-container"></div>

<!-- Bootstrap JS (necessário para os dropdowns dos modelos) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="sipad.js"></script>
</body>
</html>
